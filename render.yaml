services:
  - type: web
    name: trading-ai-experts
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALERTS_ENABLED
        value: "true"
      - key: DESKTOP_ALERTS
        value: "false"
      - key: USE_ML
        value: "true"
      - key: DB_PATH
        value: data/signals.db
